# =============================================================================
# ElderAssist AI — custom voice sentences (English)
# -----------------------------------------------------------------------------
# Install: copy to <config>/custom_sentences/en/elder_assist.yaml and restart
# Home Assistant. The matching intent handlers live in the intent_script:
# section of packages/elder_assist.yaml.
#
# Sentence syntax notes (HA / hassil):
#   (a|b)      -> alternatives
#   [optional] -> optional words
#   {slot}     -> a captured value; defined under lists: below
#   Wildcards ({message}, {thing}, {location}) capture free text and must have
#   literal text or a non-wildcard list slot between them (never two wildcards
#   back to back) — that's why {thing} {prep} {location} has {prep} in between.
# =============================================================================
language: "en"

intents:
  # "remind me to walk the dog in 20 minutes"
  ElderRemindMeIn:
    data:
      - sentences:
          - "remind me to {message} in {minutes} [minute|minutes]"
          - "in {minutes} [minute|minutes] remind me to {message}"
          - "set a reminder to {message} in {minutes} [minute|minutes]"

  # "I took my pills" — the GENERIC phrase maps to medication slot 1. For a two-med
  # regimen, use the morning/evening phrasing (or the tablet) to hit the right slot.
  # "I took my morning ..." also resolves here (medication 1).
  ElderMedicationTaken:
    data:
      - sentences:
          - "I (took|have taken|took my|have taken my|took the) (medicine|pills|medication|meds|tablets)"
          - "I've taken my (medicine|pills|medication|meds|tablets)"
          - "(I already took|already took) my (medicine|pills|medication|meds|tablets)"
          - "I took my morning (medicine|pills|medication)"

  # "I took my evening pills" — second medication slot (input_boolean.medication_acknowledged_2)
  ElderMedicationTaken2:
    data:
      - sentences:
          - "I took my (evening|night) (medicine|pills|medication)"
          - "I've taken my (evening|night) (medicine|pills|medication)"
          - "I took my second (medicine|pill)"

  # "I put the keys on the counter"
  ElderStoreThingLocation:
    data:
      - sentences:
          - "I (put|left|placed) [the] {thing} {prep} {location}"
          - "the {thing} (is|are) {prep} {location}"

  # "where did I put the keys" / "where is the remote"
  ElderWhereDidIPut:
    data:
      - sentences:
          - "where did I (put|leave) [the|my] {thing}"
          - "where (is|are) [the|my] {thing}"
          - "where's [the|my] {thing}"

  # "I'm okay"
  ElderImOkay:
    data:
      - sentences:
          - "(I'm|I am) (okay|ok|fine|alright|all right|doing fine|doing okay)"
          - "yes I'm (okay|ok|fine)"

lists:
  # Numeric slot for the reminder delay.
  minutes:
    range:
      from: 1
      to: 1440   # match script.remind_me_in (up to 24h)
  # Preposition slot — also the required literal boundary between the two
  # wildcards in the "I put the {thing} {prep} {location}" sentence.
  prep:
    values:
      - "in"
      - "in the"
      - "on"
      - "on the"
      - "under"
      - "under the"
      - "by"
      - "by the"
      - "next to"
      - "behind"
      - "inside"
      - "inside the"
  # Free-text wildcards.
  message:
    wildcard: true
  thing:
    wildcard: true
  location:
    wildcard: true
