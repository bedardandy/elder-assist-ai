# =============================================================================
# ElderAssist AI — Home Assistant package
# -----------------------------------------------------------------------------
# This is a Home Assistant "package": one file that bundles the shared helpers,
# scripts and voice intents the ElderAssist blueprints and dashboard rely on.
#
# Install: copy this file to <config>/packages/elder_assist.yaml and add to
# configuration.yaml (once):
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# Then restart Home Assistant. See ha/README.md for the full walkthrough.
#
# EDIT MARKERS: search this file for "# EDIT" — those lines reference entities
# that are specific to your house (your media players, your TTS engine).
# =============================================================================

# -----------------------------------------------------------------------------
# Helpers (created here so they exist on boot; no UI clicks required)
# -----------------------------------------------------------------------------
input_boolean:
  # Flipped ON when the elder acknowledges a dose (by voice, dashboard tile, or
  # the notification button). The medication_reminder blueprint waits on this.
  medication_acknowledged:
    name: Medication acknowledged
    icon: mdi:pill
  # A second slot, for a household that tracks two independent medications.
  medication_acknowledged_2:
    name: Medication acknowledged (second)
    icon: mdi:pill-multiple

input_text:
  # "Where did I put the ...": the last item the elder told us about, and where.
  last_thing_put_away:
    name: Last thing put away
    max: 255
    icon: mdi:help-box
  last_thing_location:
    name: Last thing location
    max: 255
    icon: mdi:map-marker

input_button:
  # The elder taps this (dashboard) or says "I'm okay" to confirm wellness.
  i_am_ok:
    name: I am OK
    icon: mdi:hand-wave

counter:
  # Bumped by automations when a reminder is missed / escalated. Surfaced on the
  # caregiver dashboard so a bad week is visible at a glance.
  reminders_missed:
    name: Reminders missed
    icon: mdi:alert-circle
    step: 1
    minimum: 0

# -----------------------------------------------------------------------------
# Announce target group
# -----------------------------------------------------------------------------
# A plain group of the media players ElderAssist should talk through by default.
# Scripts below expand this group to a list of entity_ids for tts.speak.
# EDIT: replace the placeholder entities with your real media players.
group:
  elder_announce_targets:
    name: Elder announce targets
    entities:
      - media_player.living_room_speaker   # EDIT
      - media_player.kitchen_speaker        # EDIT

# -----------------------------------------------------------------------------
# Scripts
# -----------------------------------------------------------------------------
script:
  # ---------------------------------------------------------------------------
  # elder_announce — speak a message through the announce group (or given
  # targets) using tts.speak. Central "say this out loud" helper.
  # ---------------------------------------------------------------------------
  elder_announce:
    alias: Elder Announce
    icon: mdi:bullhorn
    mode: parallel
    max: 10
    fields:
      message:
        description: What to say out loud.
        example: It's time for your morning pills.
        required: true
        selector:
          text:
      targets:
        description: >-
          Optional media players to announce on. Defaults to the
          group.elder_announce_targets group when omitted.
        selector:
          entity:
            multiple: true
            filter:
              - domain: media_player
      volume:
        description: >-
          Optional. Set the target speakers to this volume (0–100) before speaking —
          helpful for hearing loss. Omit or 0 leaves the current volume unchanged.
        selector:
          number:
            min: 0
            max: 100
            step: 5
            mode: slider
    sequence:
      - variables:
          # Use explicit targets if provided, else expand the default group.
          tts_targets: >-
            {% if targets is defined and targets %}
              {{ targets }}
            {% else %}
              {{ expand('group.elder_announce_targets')
                 | map(attribute='entity_id') | list }}
            {% endif %}
      # Optional hearing-loss volume: only when a volume > 0 was passed.
      - if:
          - condition: template
            value_template: "{{ volume is defined and (volume | int(0)) > 0 }}"
        then:
          - action: media_player.volume_set
            target:
              entity_id: "{{ tts_targets }}"
            data:
              volume_level: "{{ (volume | int) / 100 }}"
      - action: tts.speak
        target:
          entity_id: tts.piper   # EDIT: your TTS engine entity (e.g. tts.piper)
        data:
          media_player_entity_id: "{{ tts_targets }}"
          message: "{{ message }}"
          cache: true

  # ---------------------------------------------------------------------------
  # elder_cast_instruction — put something on the TV screen.
  # Two mechanisms, pick per call:
  #   * image_url given  -> media_player.play_media casts that image/URL
  #     directly (works on any Cast/DLNA screen, good for a photo or a
  #     "how to use the washing machine" card hosted anywhere).
  #   * image_url omitted -> cast.show_lovelace_view casts a Lovelace
  #     dashboard view (Google Cast only; richest, live, interactive card).
  # ---------------------------------------------------------------------------
  elder_cast_instruction:
    alias: Elder Cast Instruction
    icon: mdi:television-play
    mode: parallel
    max: 5
    fields:
      target:
        description: The Chromecast / Android TV media_player to cast to.
        required: true
        selector:
          entity:
            filter:
              - domain: media_player
      dashboard_path:
        description: >-
          Lovelace dashboard URL path to cast (e.g. lovelace-elder). Used with
          view_path when no image_url is given.
        example: lovelace-elder
        selector:
          text:
      view_path:
        description: The view path or index within the dashboard (e.g. help).
        example: help
        selector:
          text:
      image_url:
        description: >-
          Optional. A photo / instruction-card image or web URL to cast
          straight to the screen instead of a dashboard.
        example: https://example.local/cards/washing-machine.jpg
        selector:
          text:
    sequence:
      - choose:
          # Option B: cast an image / URL straight to the screen.
          - conditions: "{{ image_url is defined and image_url }}"
            sequence:
              - action: media_player.play_media
                target:
                  entity_id: "{{ target }}"
                data:
                  media_content_id: "{{ image_url }}"
                  media_content_type: image/jpeg
        # Option A: cast a Lovelace dashboard view (Google Cast only).
        default:
          - action: cast.show_lovelace_view
            data:
              entity_id: "{{ target }}"
              dashboard_path: "{{ dashboard_path }}"
              view_path: "{{ view_path }}"

  # ---------------------------------------------------------------------------
  # remind_me_in — a one-shot "remind me in N minutes" timer.
  # mode: parallel means many concurrent reminders coexist; each waits out its
  # own templated delay then announces. Simple, robust, survives nothing-else.
  # (For reminders that must survive a reboot, use an appointment/calendar
  # entry instead — a delay is lost on restart, which is fine for "in 10 min".)
  # ---------------------------------------------------------------------------
  remind_me_in:
    alias: Remind Me In
    icon: mdi:timer-outline
    mode: parallel
    max: 25
    fields:
      minutes:
        description: How many minutes from now to remind.
        example: 10
        required: true
        selector:
          number:
            min: 1
            max: 1440
            step: 1
            unit_of_measurement: minutes
            mode: box
      message:
        description: What to remind about.
        example: take the chicken out of the oven
        required: true
        selector:
          text:
    sequence:
      - delay:
          minutes: "{{ minutes | int }}"
      - action: script.elder_announce
        data:
          message: "Reminder: {{ message }}."

  # ---------------------------------------------------------------------------
  # find_keys / find_wallet — "make my keys/wallet beep" (Find My Things page).
  # These are THIN WRAPPERS the PWA calls. Out of the box they only ANNOUNCE
  # (so they load and work with NO tracker configured) plus, when the elder has
  # a "where did I put" note for that thing, they speak the last-seen location
  # as a fallback. To make a physical tag actually ring, wire in ONE ring action
  # below — see the # EDIT block in each. Full setup: ha/README.md
  # ("Finding things: Bluetooth trackers") and docs/DECISIONS.md D12.
  # ---------------------------------------------------------------------------
  find_keys:
    alias: Find Keys
    icon: mdi:key
    mode: single
    sequence:
      # 1. Always announce first — works before any tag exists.
      - action: script.elder_announce
        data:
          message: "Ringing your keys now — listen!"

      # 2. EDIT: make the physical tag ring. Pick ONE pattern, uncomment it, and
      #    set the entity/service to yours (find it after adding the tag — see
      #    ha/README.md). Leave BOTH commented and the script still works
      #    (announce + spoken fallback below), it just won't beep a tag.
      #
      #    Pattern A — a "works-with-HA" tag (Chipolo/Pebblebee) exposes a
      #    button entity that rings it:
      # - action: button.press
      #   target:
      #     entity_id: button.chipolo_keys_ring        # EDIT: your tag's ring button
      #
      #    Pattern B — a DIY ESP32/ESPHome key-finder exposes a service:
      # - action: esphome.keyfinder_ring               # EDIT: your ESPHome ring service

      # 3. Spoken fallback: if the elder told us where the keys are, read it back
      #    (helps even when a tag is out of range or not set up).
      - if:
          - condition: template
            value_template: >-
              {{ states('input_text.last_thing_put_away') | lower == 'keys'
                 and states('input_text.last_thing_location')
                     not in ['unknown', 'unavailable', ''] }}
        then:
          - action: script.elder_announce
            data:
              message: >-
                If you can't hear them, the last place you told me was
                {{ states('input_text.last_thing_location') }}.

  find_wallet:
    alias: Find Wallet
    icon: mdi:wallet
    mode: single
    sequence:
      # 1. Always announce first — works before any tag exists.
      - action: script.elder_announce
        data:
          message: "Ringing your wallet now — listen!"

      # 2. EDIT: make the physical tag ring. Pick ONE pattern, uncomment it, and
      #    set the entity/service to yours. Leave BOTH commented and the script
      #    still works (announce + spoken fallback below).
      #
      #    Pattern A — a "works-with-HA" tag (Chipolo/Pebblebee) ring button:
      # - action: button.press
      #   target:
      #     entity_id: button.chipolo_wallet_ring      # EDIT: your tag's ring button
      #
      #    Pattern B — a DIY ESP32/ESPHome finder service:
      # - action: esphome.walletfinder_ring            # EDIT: your ESPHome ring service

      # 3. Spoken fallback: read back the last place the wallet was noted.
      - if:
          - condition: template
            value_template: >-
              {{ states('input_text.last_thing_put_away') | lower == 'wallet'
                 and states('input_text.last_thing_location')
                     not in ['unknown', 'unavailable', ''] }}
        then:
          - action: script.elder_announce
            data:
              message: >-
                If you can't hear it, the last place you told me was
                {{ states('input_text.last_thing_location') }}.

# -----------------------------------------------------------------------------
# Voice intents (intent_script)
# -----------------------------------------------------------------------------
# These implement the custom sentences defined in
# custom_sentences/en/elder_assist.yaml. Slot values from the sentences arrive
# as top-level template variables (e.g. {{ minutes }}, {{ thing }}).
# -----------------------------------------------------------------------------
intent_script:
  # "remind me to {message} in {minutes} minutes"
  ElderRemindMeIn:
    action:
      - action: script.remind_me_in
        data:
          minutes: "{{ minutes | int }}"
          message: "{{ message }}"
    speech:
      text: "Okay, I'll remind you to {{ message }} in {{ minutes }} minutes."

  # "I took my medicine | pills | medication | meds" — the generic phrase (and
  # "morning ...") acknowledges medication 1.
  ElderMedicationTaken:
    action:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.medication_acknowledged
    speech:
      text: Great, I've marked your medication as taken.

  # "I took my evening/night pills" / "I took my second medicine" — medication 2.
  ElderMedicationTaken2:
    action:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.medication_acknowledged_2
    speech:
      text: Great, I've marked your second medication as taken.

  # "I put the {thing} {prep} {location}"
  # The wildcards capture articles/possessives verbatim ("my keys", "the kitchen
  # drawer"), so we normalize the thing at store time — "where are my keys" and
  # "where are the keys" must find the same note. (Found in the live rehearsal,
  # docs/REHEARSAL.md.)
  ElderStoreThingLocation:
    action:
      - action: input_text.set_value
        target:
          entity_id: input_text.last_thing_put_away
        data:
          value: "{{ thing | lower | regex_replace('^(my|the|his|her|our|some) ', '') }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.last_thing_location
        data:
          value: "{{ prep }} {{ location }}"
    speech:
      # Echo the speaker's own words back; avoids is/are and article stacking.
      text: "Got it. {{ thing | capitalize }} — {{ prep }} {{ location }}. I'll remember."

  # "where did I put the {thing}" / "where is the {thing}"
  ElderWhereDidIPut:
    speech:
      text: >-
        {% set noted = states('input_text.last_thing_put_away') %}
        {% set where = states('input_text.last_thing_location') %}
        {% set asked = thing | lower | regex_replace('^(my|the|his|her|our|some) ', '') %}
        {% if noted | lower == asked and where not in ['unknown', 'unavailable', ''] %}
          You put the {{ asked }} {{ where }}.
        {% elif noted not in ['unknown', 'unavailable', ''] %}
          I don't have a note about the {{ asked }}. The last thing I noted was
          the {{ noted }}, which is {{ where }}.
        {% else %}
          I'm sorry, I don't have a note about where the {{ asked }} is.
        {% endif %}

  # "I'm okay" / "I am fine"
  ElderImOkay:
    action:
      - action: input_button.press
        target:
          entity_id: input_button.i_am_ok
    speech:
      text: Thank you for letting me know you're okay.

# -----------------------------------------------------------------------------
# Reminders to-do list (guidance only — packages cannot create it)
# -----------------------------------------------------------------------------
# The Reminders list on the dashboard uses a todo.* entity. Create it once via
# the UI: Settings -> Devices & Services -> Add Integration -> "Local To-do",
# name it "Reminders". That yields todo.reminders, which the dashboard's
# to-do-list card and Hermes/voice "add to my list" flows write to.
# (The Local To-do integration cannot be set up from YAML/packages.)
#
# ALSO create a second Local To-do list named "Projects" -> yields todo.projects.
# This is the list the seasonal_chore_reminder blueprint writes to (gutters,
# furnace filter, smoke-detector batteries, snow/mowing contracts): a caregiver
# actually works the Projects list, separate from the elder's day-to-day
# Reminders. Point each seasonal_chore_reminder automation's "To-do list" input
# at todo.projects.

# -----------------------------------------------------------------------------
# Hub-down watchdog (dead-man's switch) — COMMENTED OUT, opt-in
# -----------------------------------------------------------------------------
# THE BLIND SPOT: no automation inside Home Assistant can tell you that HA itself
# (or the whole hub) is DOWN — a dead box sends nothing, and a stopped automation
# cannot report that it stopped. The only fix is an EXTERNAL dead-man's switch:
# HA pings a healthcheck URL every few minutes; if the pings STOP, that external
# service (not HA) alerts the caregiver. This is what catches a crashed hub, a
# pulled plug, or a dead internet connection.
#
# Use healthchecks.io (free tier) or a self-hosted Healthchecks instance.
#
# TO ENABLE:
#   1. Create a check at https://healthchecks.io — period 5 min, grace ~10–15 min —
#      and copy its ping URL. Configure that check to email / SMS / push the
#      CAREGIVER when it goes down (that alert is the whole point).
#   2. Uncomment the two blocks below and replace YOUR-UUID-HERE with your ping URL.
#   3. Restart Home Assistant.
#
# Left COMMENTED so the package still loads with ZERO external dependencies.
#
# rest_command:
#   heartbeat_ping:
#     url: "https://hc-ping.com/YOUR-UUID-HERE"   # paste your healthchecks.io ping URL
#     method: get
#     timeout: 10
#
# automation:
#   - alias: ElderAssist Heartbeat
#     description: >-
#       Ping the external dead-man's switch every 5 minutes. If HA or the hub dies,
#       the pings stop and healthchecks.io alerts the caregiver — catching the one
#       failure mode no in-HA automation can self-report.
#     triggers:
#       - trigger: time_pattern
#         minutes: "/5"
#     actions:
#       - action: rest_command.heartbeat_ping
#     mode: single
